name: Build and deploy to Azure & DDHub-dev

on:
  push:
    branches: [develop-intelligent]
    paths-ignore:
      - "devops/**"
  workflow_dispatch:

jobs:
  cancel-previous:
    name: "Cancel Previous Runs"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: styfle/cancel-workflow-action@0.9.1
        with:
          access_token: ${{ github.token }}
  unique_id:
    runs-on: ubuntu-latest
    steps:
      - name: Generate unique id
        id: unique_id
        run: echo "::set-output name=id::$(uuidgen)"
    outputs:
      unique_id: ${{ steps.unique_id.outputs.id }}
  install-build-and-push:
    runs-on: ubuntu-latest
    needs: [cancel-previous, unique_id]
    steps:
      - name: Get GHA environment name
        id: env_vars
        run: |
          echo "Running on branch ${{ github.ref }}"
          if [ "${{ github.ref }}" = "refs/heads/develop-intelligent" ]; then
            echo "::set-output name=aws_access_key_id::${{ secrets.DEV_AWS_ACCESS_KEY_ID }}"
            echo "::set-output name=aws_secret_key::${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}"
            echo "::set-output name=aws_region::${{ secrets.DEV_AWS_REGION }}"
            echo "::set-output name=aws_ecr_repository::${{ secrets.DEV_ECR_REPOSITORY }}"
            echo "::set-output name=argocd_url::${{ secrets.AZURE_ARGOCD_DEV_URL }}"
            echo "::set-output name=argocd_username::${{ secrets.AZURE_ARGOCD_DEV_USERNAME }}"
            echo "::set-output name=argocd_password::${{ secrets.AZURE_ARGOCD_DEV_PASS }}"
            echo "::set-output name=argocd_app_name::"ddhub-messagebroker-dev"
            echo "::set-output name=argocd_tag::"did-auth-proxy-helm.image.tag"
          else
            echo "Branch ${{ github.ref }} is not configured for deployment"
            exit 1
          fi
      - uses: actions/checkout@v2
      - name: Setup app dependencies
        uses: actions/setup-node@v2
        with:
          node-version: "18"

      - uses: actions/cache@v4
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: |
            authorization-server/node_modules
            backend-server/node_modules
            generate-identity-cli/node_modules

          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        run: yarn install

      - name: Check linting
        run: yarn lint

      - name: Build project
        run: yarn build

      # - name: Test project
      #   run: yarn test

      - name: Get the tag version

        id: get_version
        run: echo ::set-output name=VERSION::${GITHUB_REF#refs/tags/}

      - name: Login to Azure registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Push image (Azure)
        env:
          BUILD_ID: ${{needs.unique_id.outputs.unique_id}}
          ACR_REGISTRY: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}
          REPO_NAME: ${{ steps.env_vars.outputs.aws_ecr_repository }}
        run: |
          docker build -t $ACR_REGISTRY/$REPO_NAME:$BUILD_ID -f authorization-server/Dockerfile ./authorization-server
          docker push $ACR_REGISTRY/$REPO_NAME:$BUILD_ID
          docker tag $ACR_REGISTRY/$REPO_NAME:$BUILD_ID $ACR_REGISTRY/$REPO_NAME:canary-intelligent
          docker push $ACR_REGISTRY/$REPO_NAME:canary-intelligent

      # - name: ArgoCD login
      #   uses: clowdhaus/argo-cd-action/@v1.12.1
      #   id: argocd_login
      #   with:
      #     command: login ${{ steps.env_vars.outputs.argocd_url }}
      #     options: --insecure --password ${{ steps.env_vars.outputs.argocd_password }} --username ${{ steps.env_vars.outputs.argocd_username }}

