version: "3.8"

services:
  webserver:
    restart: unless-stopped
    image: did-auth-proxy-webserver
    pull_policy: never
    build:
      context: nginx
    ports:
      - "127.0.0.1:8080:80"
    networks:
      dev-backend:
    volumes:
      - ./nginx/nginx.dev.conf:/opt/bitnami/nginx/conf/server_blocks/nginx.conf
    extra_hosts:
      - host.docker.internal:host-gateway
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /opt/bitnami/nginx/tmp
      - /opt/bitnami/nginx/logs

  backend:
    restart: unless-stopped
    image: did-auth-proxy-backend
    pull_policy: never
    build:
      context: backend-server
    networks:
      dev-backend:
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  redis:
    image: bitnamilegacy/redis:7.4
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      dev-backend:
    volumes:
      - dev-redis-data:/bitnami/redis/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - REDIS_HOSTS=redis:redis:6379
    networks:
      dev-backend:
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  dev-redis-data:

networks:
  dev-backend:
